name: Instalador de Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Security (docs/SEGURIDAD.md): every action is pinned to a full commit SHA (a moved tag cannot
# change what runs), the checkout does not keep the token, the lockfile is installed as is and the
# build fails if `pnpm audit` finds any known vulnerability.
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Auditoría de dependencias (falla con cualquier vulnerabilidad conocida)
        run: pnpm audit --audit-level=low
      - run: pnpm run check
      - run: pnpm run build:desktop

      - run: pnpm exec electron-builder --win --publish never
        env:
          # The installer is not code-signed yet.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Real Windows checks (docs/SEGURIDAD.md). 1) The app from source, driven over the DevTools
      # protocol: pages, routes, reload, backups and inventory database (IPC), migration from
      # localStorage, network blocked, CSP, UI flow. Phase 1 ends by closing the app (WM_CLOSE)
      # right after a change; phase 2 starts it again and checks the data in the UI and mi-lab.db.
      - name: Prueba de humo (código fuente, DevTools, con reinicio)
        shell: pwsh
        run: |
          # require('electron') returns the binary path (downloading it on first use).
          $electron = (node -e "console.log(require('electron'))" | Select-Object -Last 1).Trim()
          $app = Start-Process -PassThru -FilePath $electron -ArgumentList '.', '--remote-debugging-port=9333'
          try {
            node scripts/desktop-smoke.mjs 9333 first $app.Id; if ($LASTEXITCODE -ne 0) { exit 1 }
            $app.WaitForExit(20000) | Out-Null
          }
          finally { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 2
          $app = Start-Process -PassThru -FilePath $electron -ArgumentList '.', '--remote-debugging-port=9333'
          try { node scripts/desktop-smoke.mjs 9333 restart; if ($LASTEXITCODE -ne 0) { exit 1 } }
          finally { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }

      # 2) The packaged Mi-lab.exe (fuses + asar integrity): it must open a window whose title
      # comes from the page ("… · Mi-lab"), so the renderer loaded; and it must refuse to start
      # with a remote-debugging switch.
      - name: Prueba del ejecutable empaquetado
        shell: pwsh
        run: |
          $exe = 'release/win-unpacked/Mi-lab.exe'
          Get-Process Mi-lab, electron -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $p = Start-Process -PassThru -FilePath $exe
          $title = ''
          for ($i = 0; $i -lt 60 -and -not ($title -like '*Mi-lab*' -and $title -ne 'Mi-lab'); $i++) {
            Start-Sleep -Seconds 1
            $title = (Get-Process -Id $p.Id -ErrorAction SilentlyContinue).MainWindowTitle
            if ($p.HasExited) { throw "Mi-lab.exe se cerró al abrir (código $($p.ExitCode))" }
          }
          Write-Host "Título de la ventana: $title"
          Get-Process Mi-lab -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not ($title -like '* · Mi-lab')) { throw 'La página no cargó en el ejecutable empaquetado' }
          Start-Sleep -Seconds 2
          $d = Start-Process -PassThru -FilePath $exe -ArgumentList '--remote-debugging-port=9444'
          if (-not $d.WaitForExit(20000)) { Stop-Process -Id $d.Id -Force; throw 'Arrancó con --remote-debugging-port' }
          Write-Host "Con --remote-debugging-port se cerró con código $($d.ExitCode)"

      # 3) The installer: silent per-user install, the installed app opens, silent uninstall keeps
      # the user's data.
      - name: Prueba del instalador
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release/Mi-lab-Setup-*.exe).FullName
          $i = Start-Process -PassThru -Wait -FilePath $setup -ArgumentList '/S'
          if ($i.ExitCode -ne 0) { throw "El instalador terminó con código $($i.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/Mi-lab/Mi-lab.exe'
          if (-not (Test-Path $installed)) { throw "No se encontró $installed" }
          $p = Start-Process -PassThru -FilePath $installed
          $title = ''
          for ($n = 0; $n -lt 60 -and -not ($title -like '* · Mi-lab'); $n++) {
            Start-Sleep -Seconds 1
            $title = (Get-Process -Id $p.Id -ErrorAction SilentlyContinue).MainWindowTitle
          }
          Get-Process Mi-lab -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not ($title -like '* · Mi-lab')) { throw 'La app instalada no abrió la ventana' }
          $data = Join-Path $env:APPDATA 'Mi-lab'
          if (-not (Test-Path $data)) { throw "No se creó $data" }
          $db = Join-Path $data 'mi-lab.db'
          if (-not (Test-Path $db)) { throw "No se creó la base de datos $db" }
          Start-Sleep -Seconds 2
          $uninstaller = Join-Path $env:LOCALAPPDATA 'Programs/Mi-lab/Uninstall Mi-lab.exe'
          $u = Start-Process -PassThru -Wait -FilePath $uninstaller -ArgumentList '/S'
          Start-Sleep -Seconds 5
          if (Test-Path $installed) { throw 'El desinstalador no quitó la app' }
          if (-not (Test-Path $data)) { throw 'El desinstalador borró los datos del usuario' }
          if (-not (Test-Path $db)) { throw 'El desinstalador borró la base de datos' }
          Write-Host "Instalación, apertura y desinstalación correctas; datos conservados en $data"

      - name: Suma SHA-256 del instalador
        shell: pwsh
        run: |
          Get-ChildItem release/Mi-lab-Setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii release/SHA256SUMS.txt
          }
          Get-Content release/SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mi-lab-instalador-windows
          path: |
            release/Mi-lab-Setup-*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Mi-lab-instalador-windows
      - name: Adjuntar el instalador al Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Mi-lab $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" Mi-lab-Setup-*.exe SHA256SUMS.txt --clobber
