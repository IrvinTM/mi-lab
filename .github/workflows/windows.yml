name: Instaladores (Windows y Linux)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Security (docs/SEGURIDAD.md): every action is pinned to a full commit SHA (a moved tag cannot
# change what runs), the checkout does not keep the token, the lockfile is installed as is and the
# build fails if `pnpm audit` finds any known vulnerability.
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Auditoría de dependencias (falla con cualquier vulnerabilidad conocida)
        run: pnpm audit --audit-level=low
      - run: pnpm run check
      - run: pnpm run build:desktop

      - run: pnpm exec electron-builder --win --publish never
        env:
          # The installer is not code-signed yet.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Real Windows checks (docs/SEGURIDAD.md). 1) The app from source, driven over the DevTools
      # protocol: pages, routes, reload, backups and inventory database (IPC), migration from
      # localStorage, network blocked, CSP, UI flow. Phase 1 ends by closing the app (WM_CLOSE)
      # right after a change; phase 2 starts it again and checks the data in the UI and mi-lab.db.
      - name: Prueba de humo (código fuente, DevTools, con reinicio)
        shell: pwsh
        run: |
          # require('electron') returns the binary path (downloading it on first use).
          $electron = (node -e "console.log(require('electron'))" | Select-Object -Last 1).Trim()
          $app = Start-Process -PassThru -FilePath $electron -ArgumentList '.', '--remote-debugging-port=9333'
          try {
            node scripts/desktop-smoke.mjs 9333 first $app.Id; if ($LASTEXITCODE -ne 0) { exit 1 }
            $app.WaitForExit(20000) | Out-Null
          }
          finally { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 2
          $app = Start-Process -PassThru -FilePath $electron -ArgumentList '.', '--remote-debugging-port=9333'
          try { node scripts/desktop-smoke.mjs 9333 restart; if ($LASTEXITCODE -ne 0) { exit 1 } }
          finally { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }

      # 2) The packaged Mi-lab.exe (fuses + asar integrity): it must open a window whose title
      # comes from the page ("… · Mi-lab"), so the renderer loaded; and it must refuse to start
      # with a remote-debugging switch.
      - name: Prueba del ejecutable empaquetado
        shell: pwsh
        run: |
          $exe = 'release/win-unpacked/Mi-lab.exe'
          Get-Process Mi-lab, electron -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $p = Start-Process -PassThru -FilePath $exe
          $title = ''
          for ($i = 0; $i -lt 60 -and -not ($title -like '*Mi-lab*' -and $title -ne 'Mi-lab'); $i++) {
            Start-Sleep -Seconds 1
            $title = (Get-Process -Id $p.Id -ErrorAction SilentlyContinue).MainWindowTitle
            if ($p.HasExited) { throw "Mi-lab.exe se cerró al abrir (código $($p.ExitCode))" }
          }
          Write-Host "Título de la ventana: $title"
          Get-Process Mi-lab -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not ($title -like '* · Mi-lab')) { throw 'La página no cargó en el ejecutable empaquetado' }
          Start-Sleep -Seconds 2
          $d = Start-Process -PassThru -FilePath $exe -ArgumentList '--remote-debugging-port=9444'
          if (-not $d.WaitForExit(20000)) { Stop-Process -Id $d.Id -Force; throw 'Arrancó con --remote-debugging-port' }
          Write-Host "Con --remote-debugging-port se cerró con código $($d.ExitCode)"

      # 3) The installer: silent per-user install, the installed app opens, silent uninstall keeps
      # the user's data.
      - name: Prueba del instalador
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release/Mi-lab-Setup-*.exe).FullName
          $i = Start-Process -PassThru -Wait -FilePath $setup -ArgumentList '/S'
          if ($i.ExitCode -ne 0) { throw "El instalador terminó con código $($i.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/Mi-lab/Mi-lab.exe'
          if (-not (Test-Path $installed)) { throw "No se encontró $installed" }
          $p = Start-Process -PassThru -FilePath $installed
          $title = ''
          for ($n = 0; $n -lt 60 -and -not ($title -like '* · Mi-lab'); $n++) {
            Start-Sleep -Seconds 1
            $title = (Get-Process -Id $p.Id -ErrorAction SilentlyContinue).MainWindowTitle
          }
          Get-Process Mi-lab -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not ($title -like '* · Mi-lab')) { throw 'La app instalada no abrió la ventana' }
          $data = Join-Path $env:APPDATA 'Mi-lab'
          if (-not (Test-Path $data)) { throw "No se creó $data" }
          $db = Join-Path $data 'mi-lab.db'
          if (-not (Test-Path $db)) { throw "No se creó la base de datos $db" }
          Start-Sleep -Seconds 2
          $uninstaller = Join-Path $env:LOCALAPPDATA 'Programs/Mi-lab/Uninstall Mi-lab.exe'
          $u = Start-Process -PassThru -Wait -FilePath $uninstaller -ArgumentList '/S'
          Start-Sleep -Seconds 5
          if (Test-Path $installed) { throw 'El desinstalador no quitó la app' }
          if (-not (Test-Path $data)) { throw 'El desinstalador borró los datos del usuario' }
          if (-not (Test-Path $db)) { throw 'El desinstalador borró la base de datos' }
          Write-Host "Instalación, apertura y desinstalación correctas; datos conservados en $data"

      # 4) The update (docs/INSTALACION.md §5) with real data, as it happens in the lab: the last
      # published version is installed (checksum verified), opened once (it creates mi-lab.db),
      # filled with ≈ 5,500 movements, opened again (it must read them) and left OPEN while this
      # installer runs over it. The new version must open with the same data: every table
      # identical, integrity and references intact, the schema upgraded and a copy of the
      # database as it was (mi-lab.db.v<old>.bak). A window titled "<page> · Mi-lab" means the
      # page loaded the data (the error screen keeps the plain "Mi-lab" title).
      - name: Prueba de actualización (versión publicada → esta, con datos y la app abierta)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $current = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = gh release list --repo $env:GITHUB_REPOSITORY --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' |
            Where-Object { $_ -ne "v$current" } | Select-Object -First 1
          if (-not $tag) { throw 'No hay una versión publicada para probar la actualización' }
          Write-Host "Actualización: $tag → v$current"
          New-Item -ItemType Directory -Force upgrade | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --dir upgrade --pattern 'Mi-lab-Setup-*.exe' --pattern 'SHA256SUMS.txt'
          $old = Get-ChildItem upgrade/Mi-lab-Setup-*.exe
          $sum = (Select-String -Path upgrade/SHA256SUMS.txt -SimpleMatch $old.Name).Line.Split(' ')[0]
          if ((Get-FileHash $old.FullName -Algorithm SHA256).Hash.ToLower() -ne $sum) { throw "Suma SHA-256 distinta para $($old.Name)" }

          $exe = Join-Path $env:LOCALAPPDATA 'Programs/Mi-lab/Mi-lab.exe'
          $data = Join-Path $env:APPDATA 'Mi-lab'
          $db = Join-Path $data 'mi-lab.db'
          function Open-App {
            $p = Start-Process -PassThru -FilePath $exe
            $title = ''
            for ($n = 0; $n -lt 60 -and -not ($title -like '* · Mi-lab'); $n++) {
              Start-Sleep -Seconds 1
              if ($p.HasExited) { throw "Mi-lab se cerró al abrir (código $($p.ExitCode))" }
              $title = (Get-Process -Id $p.Id -ErrorAction SilentlyContinue).MainWindowTitle
            }
            if (-not ($title -like '* · Mi-lab')) { throw "La app no cargó los datos (título: '$title')" }
            Write-Host "Abierta: $title"
            Start-Sleep -Seconds 2
            return $p
          }
          function Close-App($p) {
            $p.CloseMainWindow() | Out-Null
            if (-not $p.WaitForExit(20000)) { throw 'Mi-lab no se cerró' }
          }
          function Invoke-Check { node @args; if ($LASTEXITCODE -ne 0) { throw "Falló: node $args" } }

          # Clean machine with the published version.
          Get-Process Mi-lab, electron -ErrorAction SilentlyContinue | Stop-Process -Force
          $uninstaller = Join-Path $env:LOCALAPPDATA 'Programs/Mi-lab/Uninstall Mi-lab.exe'
          if (Test-Path $uninstaller) { Start-Process -Wait -FilePath $uninstaller -ArgumentList '/S' }
          Start-Sleep -Seconds 3
          Remove-Item -Recurse -Force $data -ErrorAction SilentlyContinue
          $i = Start-Process -PassThru -Wait -FilePath $old.FullName -ArgumentList '/S'
          if ($i.ExitCode -ne 0) { throw "El instalador $tag terminó con código $($i.ExitCode)" }
          Close-App (Open-App)
          Invoke-Check scripts/upgrade-test.mjs seed $db
          Close-App (Open-App)
          Invoke-Check scripts/upgrade-test.mjs dump $db upgrade/before.json

          # Update with the old version open.
          $running = Open-App
          $new = (Get-ChildItem release/Mi-lab-Setup-*.exe).FullName
          $u = Start-Process -PassThru -Wait -FilePath $new -ArgumentList '/S'
          if ($u.ExitCode -ne 0) { throw "El instalador nuevo terminó con código $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (-not $running.HasExited) { throw 'La versión anterior siguió abierta después de actualizar' }
          $version = (Get-Item $exe).VersionInfo.ProductVersion
          if (-not $version.StartsWith($current)) { throw "Versión instalada $version, se esperaba $current" }
          Write-Host "Instalada la versión $version"

          # The new version migrates on open; a second opening changes nothing.
          Close-App (Open-App)
          Invoke-Check scripts/upgrade-test.mjs verify $db upgrade/before.json 2
          Close-App (Open-App)
          Invoke-Check scripts/upgrade-test.mjs verify $db upgrade/before.json 2
          Get-ChildItem $data | Format-Table Name, Length

      - name: Suma SHA-256 del instalador
        shell: pwsh
        run: |
          Get-ChildItem release/Mi-lab-Setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii release/SHA256SUMS.txt
          }
          Get-Content release/SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mi-lab-instalador-windows
          path: |
            release/Mi-lab-Setup-*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

  # Linux AppImage (portable, no installation). Same audit and checks as Windows.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Auditoría de dependencias (falla con cualquier vulnerabilidad conocida)
        run: pnpm audit --audit-level=low
      - run: pnpm run check
      - run: pnpm run build:desktop
      - run: pnpm exec electron-builder --linux AppImage --publish never
      - name: Suma SHA-256 del AppImage
        run: |
          cd release
          sha256sum Mi-lab-*.AppImage > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mi-lab-appimage-linux
          path: |
            release/Mi-lab-*.AppImage
            release/SHA256SUMS-linux.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Mi-lab-*
          merge-multiple: true
      - name: Adjuntar el instalador al Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat SHA256SUMS-linux.txt >> SHA256SUMS.txt
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Mi-lab $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" Mi-lab-Setup-*.exe Mi-lab-*.AppImage SHA256SUMS.txt --clobber
