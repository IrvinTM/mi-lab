# Windows installer (NSIS). Run via `pnpm run dist:win` or in CI (.github/workflows/windows.yml).
appId: sv.mi-lab.app
productName: Mi-lab
copyright: Mi-lab
directories:
  output: release
  buildResources: build
# The app only needs the compiled page and the main process: no node_modules (React and friends
# are already bundled into dist-desktop by Vite).
files:
  - dist-desktop/**
  - dist-electron/**
  - package.json
  - '!node_modules'
asar: true
# No auto-update: without this electron-builder writes resources/app-update.yml pointing at the
# GitHub repo (the app does not use it, but nothing should suggest an update channel).
publish: null
# Electron fuses (flipped in the binary at build time, cannot be changed by config or env):
# the installed Mi-lab.exe cannot be used as a Node.js interpreter, ignores NODE_OPTIONS and
# --inspect, only runs the code inside its own app.asar and refuses an altered app.asar.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
electronLanguages:
  - es
  - es-419
win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.png
  # Not signed yet (see docs/INSTALACION.md): Windows SmartScreen shows a warning on first run.
  signAndEditExecutable: true
nsis:
  artifactName: Mi-lab-Setup-${version}.exe
  oneClick: false
  perMachine: false # per user: no administrator needed
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Mi-lab
  runAfterFinish: true
  language: '3082' # Spanish
  installerLanguages:
    - es_ES
  # The data lives in %APPDATA%\Mi-lab and Documents\Mi-lab: uninstalling must keep both.
  deleteAppDataOnUninstall: false
  # Per-user install: the elevation helper is never needed.
  packElevateHelper: false
# Linux build (`pnpm run dist:linux`): portable AppImage plus a .deb for Debian/Ubuntu.
linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  icon: build/icon.png
  category: Office
  executableName: mi-lab
  syncDesktopName: true
  maintainer: Mi-lab <irvint698@gmail.com>
  synopsis: Control de inventario de reactivos de laboratorio clínico
# New static AppImage runtime: it needs no libfuse2, which Ubuntu 22.04+ no longer installs
# (the legacy runtime fails there with "dlopen(): error loading libfuse.so.2").
toolsets:
  appimage: '1.0.3'
appImage:
  artifactName: Mi-lab-${version}-x86_64.AppImage
deb:
  artifactName: mi-lab_${version}_amd64.deb
